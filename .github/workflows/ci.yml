name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Key order, required fields, sorted dependencies. Before install, so it
      # fails fast and never walks node_modules.
      - name: Lint package.json
        uses: bvandrc/lint-package-json@v2

      - uses: ./.github/actions/setup

      - name: Lint & Type Check
        run: pnpm run check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Unit Tests
        run: pnpm run test:unit

  render:
    name: Render
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # No browser needed, so this fails fast on anything wrong with the
      # renderer, the config, or the stylesheet.
      - name: Render the example without a browser
        run: pnpm run example:html

      # Full Chromium, not `--only-shell`: the headless shell is half the
      # download but lays text out slightly differently. See build-pdf.ts.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # End to end. Fails if the example overflows its page, if the PDF comes
      # out untagged, or if a font fell back to Type3.
      - name: Render the example to a PDF
        run: pnpm run example

      - name: Upload the rendered example
        uses: actions/upload-artifact@v7
        with:
          name: example
          path: example/outputs/
